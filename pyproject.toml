[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-nmap-assistant"
version = "0.1.0"
description = "A policy-guarded assistant for authorized Nmap scans in a controlled lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0,<3.0",
    "openai>=2.0,<4.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
]
eval = [
    "matplotlib>=3.8,<4.0",
]

[project.scripts]
safe-nmap = "safe_nmap.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "lab: requires nmap and the Docker lab (lab/docker-compose.yml) to be running; skipped otherwise.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
