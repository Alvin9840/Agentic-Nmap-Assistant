name: safe-nmap-lab-targets
services:
  approved-nginx:
    image: nginx:stable-alpine
    networks:
      targets:
        ipv4_address: 172.28.0.10

  decoy-nginx:
    image: nginx:stable-alpine
    networks:
      targets:
        ipv4_address: 172.28.0.11

  scanner:
    build:
      context: ..
      dockerfile: lab/scanner.Dockerfile
    networks:
      targets:
        ipv4_address: 172.28.0.2
    volumes:
      - ../config:/app/config:ro
    working_dir: /app
    command: ["sleep", "infinity"]

networks:
  targets:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
